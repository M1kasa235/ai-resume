[project]
name = "ai-job-assistant"
version = "0.1.0"
description = "Offer Pilot — AI Job Assistant with Multi-Agent Architecture"
authors = [
    {name = "Peng Anxu"}
]
dependencies = [
    # FastAPI 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.17",
    # LangChain 相关
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-community>=0.0.13",
    "langchain-deepseek>=1.0.1",
    "langchain-tavily>=0.2.18",
    "langchain-chroma>=0.1.0",
    "langchain-text-splitters>=0.2.0",
    # 向量库 & RAG
    "chromadb>=0.4.0",
    "dashscope>=1.20.0",
    "jieba>=0.42.0",
    "rank-bm25>=0.2.0",
    # PDF 解析
    "pypdf>=4.0.0",
    # 数据库
    "sqlalchemy[asyncio]>=2.0.36",
    "aiomysql>=0.2.0",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",
    # 数据验证
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    # 认证与安全
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    # 工具库
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

requires-python = ">=3.10"
readme = "README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]
