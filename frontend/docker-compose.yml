version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - app-network

  # 开发环境服务
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:8002
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/dist
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - dev

  # 后端服务（示例）
  backend:
    image: node:18-alpine
    working_dir: /app
    ports:
      - "8002:8002"
    environment:
      - NODE_ENV=production
      - PORT=8002
    volumes:
      - ./backend:/app
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - dev

networks:
  app-network:
    driver: bridge

volumes:
  node_modules:
  dist: